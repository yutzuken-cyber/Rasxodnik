<head>

  <title>Кошелёк — личные финансы</title>
  <style>
    :root{--paper:#ecf4f7;--white:#fff;--ink:#393f4b;--muted:#7d8490;--line:#dfe7ec;--green:#910029;--mint:#f5e8ec;--red:#b40a3b;--yellow:#c8dce6;--shadow:0 18px 55px #393f4b0c}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer} .app{max-width:1120px;margin:auto;padding:30px 34px 56px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.brand{display:flex;gap:12px;align-items:center;font-size:18px;font-weight:750;letter-spacing:-.4px}.brand-mark{width:38px;height:38px;border-radius:13px;background:var(--green);display:grid;place-items:center;color:white;font-size:20px}.top-right{display:flex;align-items:center;gap:14px}.today{color:var(--muted);font-size:13px}.avatar{width:38px;height:38px;border-radius:50%;background:#e5e8df;display:grid;place-items:center;font-weight:700;color:#53645b}
    .layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,.85fr);gap:24px}.main-col,.side-col{display:flex;flex-direction:column;gap:22px}.balance{position:relative;overflow:hidden;background:#393f4b;color:#fff;border-radius:26px;padding:30px 32px;min-height:276px;box-shadow:var(--shadow)}.balance:after{content:"";position:absolute;width:250px;height:250px;border:1px solid #ffffff12;border-radius:50%;right:-35px;top:-110px;box-shadow:0 0 0 26px #ffffff08,0 0 0 52px #ffffff05}.balance-label{color:#d1d7df;font-size:13px}.balance-amount{font-size:clamp(34px,5vw,48px);font-weight:720;letter-spacing:-1.8px;margin:8px 0 11px}.account-balances{display:flex;gap:10px;max-width:440px;margin-bottom:10px}.account-balance{flex:1;min-width:0;padding:8px 11px;border:1px solid #ffffff18;border-radius:12px;background:#ffffff0c}.account-name{font-size:11px;color:#d1d7df}.account-value{font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap}.balance-foot{font-size:12px;color:#d1d7df;display:flex;gap:8px;align-items:center}.balance-foot .dot{width:7px;height:7px;background:#e79bb1;border-radius:50%}.balance-actions{position:absolute;right:28px;bottom:26px;display:flex;gap:9px;z-index:1}.action{border:0;border-radius:12px;padding:11px 15px;font-weight:650;font-size:13px}.action.income{background:#ecf4f7;color:#393f4b}.action.expense{background:#910029;color:white;border:1px solid #a7284c}
    .quick-panel{background:var(--white);border-radius:21px;padding:18px 20px 16px;box-shadow:var(--shadow)}.quick-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}.quick-head h2{font-size:15px;margin:0}.quick-head span{font-size:12px;color:#69717e;white-space:nowrap}.quick-head strong{color:var(--ink)}.quick-actions{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.quick-button{min-width:0;min-height:72px;border:1px solid #e5eaed;background:#f8fafb;border-radius:14px;padding:9px 4px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;transition:background .15s,border-color .15s,transform .15s}.quick-button:hover{background:var(--mint);border-color:#e2bac7;transform:translateY(-1px)}.quick-button:active{transform:scale(.97)}.quick-icon{width:25px;height:25px;color:var(--green);display:grid;place-items:center}.quick-icon svg{width:23px;height:23px}.quick-label{font-size:12px;font-weight:650;white-space:normal;line-height:1.15;text-align:center;overflow:visible;max-width:100%}
    .section-head{display:flex;justify-content:space-between;align-items:center;margin:1px 2px 0}.section-head h2{font-size:17px;margin:0;letter-spacing:-.3px}.month-select{border:0;background:transparent;color:var(--muted);font-size:13px;outline:none}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stat{background:var(--white);border-radius:19px;padding:18px 20px;box-shadow:var(--shadow)}.stat-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:#ecf4f7;color:var(--green);font-size:15px}.stat.exp .stat-icon{background:#f7e9ed;color:var(--red)}.stat-val{font-weight:700;font-size:21px;letter-spacing:-.6px;margin-top:12px}.stat-note{font-size:11px;color:var(--muted);margin-top:4px}
    .panel{background:var(--white);border-radius:21px;padding:20px 21px;box-shadow:var(--shadow)}.chart-panel{min-height:197px}.chart-title{display:flex;justify-content:space-between;align-items:center}.chart-title h2{font-size:15px;margin:0}.chart-legend{display:flex;gap:15px;font-size:11px;color:var(--muted)}.legend-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}.legend-dot.red{background:var(--yellow)}.chart{height:112px;display:flex;align-items:end;justify-content:space-between;gap:8px;padding-top:14px}.chart-day{height:100%;display:flex;flex:1;align-items:end;justify-content:center;gap:3px;position:relative}.bar{width:min(11px,38%);border-radius:5px 5px 2px 2px;min-height:3px;background:#910029}.bar.out{background:#b9cfda}.chart-label{position:absolute;bottom:-19px;font-size:10px;color:#8a9099}
    .transactions{padding:20px 21px 8px}.transaction-list{margin-top:10px}.transaction{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f2}.transaction:last-child{border-bottom:0}.tx-icon{width:39px;height:39px;border-radius:13px;background:#ecf4f7;display:grid;place-items:center;color:var(--green);flex:none}.tx-icon svg{width:20px;height:20px}.tx-info{flex:1;min-width:0}.tx-title{font-weight:630;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx-meta{font-size:12px;color:#69717e;margin-top:2px}.tx-amount{font-weight:700;font-size:13px;white-space:nowrap}.tx-amount.plus{color:var(--green)}.empty{padding:34px 10px 39px;text-align:center;color:var(--muted);font-size:13px}.empty-icon{font-size:25px;margin-bottom:8px}
    .side-panel{background:var(--white);border-radius:21px;padding:21px;box-shadow:var(--shadow)}.side-panel h2{font-size:15px;margin:0 0 17px}.category-list{display:flex;flex-direction:column;gap:14px}.category-row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:9px}.cat-icon{width:29px;height:29px;border-radius:9px;background:#ecf4f7;display:grid;place-items:center;color:var(--green)}.cat-icon svg{width:17px;height:17px}.cat-name{font-size:12px;font-weight:600}.cat-amount{font-size:12px;color:#69717e}.cat-track{height:4px;background:#e8eef1;border-radius:5px;margin-top:6px;grid-column:2/4;overflow:hidden}.cat-progress{height:100%;background:#910029;border-radius:5px}.tip{background:#ecf4f7;border-radius:18px;padding:17px}.tip-title{font-size:12px;font-weight:700;margin-bottom:5px}.tip p{font-size:12px;color:#626b79;margin:0;line-height:1.55}.settings{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.text-btn{border:0;background:transparent;color:var(--green);font-weight:650;padding:5px}
    .modal-backdrop{position:fixed;inset:0;background:#20242ccc;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.open{display:flex}.modal{background:var(--white);width:min(100%,430px);border-radius:24px;padding:24px;box-shadow:0 25px 80px #0003}.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal h2{font-size:20px;margin:0}.close{border:0;background:#ecf4f7;border-radius:50%;width:34px;height:34px;font-size:20px;color:#393f4b}.switch{display:flex;background:#ecf4f7;padding:4px;border-radius:12px;margin-bottom:18px}.switch button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;color:var(--muted);font-weight:650}.switch button.active[data-type="income"]{background:#fff;color:#393f4b}.switch button.active[data-type="expense"]{background:#910029;color:#fff}.field{display:block;font-size:12px;color:#626b79;font-weight:600;margin:13px 0 6px}.input{display:block;width:100%;border:1px solid #dfe7ec;border-radius:12px;padding:12px 13px;outline:none;background:white;color:var(--ink)}.input:focus{border-color:#910029;box-shadow:0 0 0 3px #91002918}.amount-wrap{position:relative}.amount-wrap .input{font-size:23px;font-weight:700;padding:13px 56px 13px 14px}.currency{position:absolute;right:15px;top:15px;color:var(--muted);font-size:13px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.save{width:100%;border:0;border-radius:13px;padding:13px;background:#910029;color:white;font-weight:700;margin-top:19px}.delete{border:0;background:transparent;color:#b95147;font-size:12px;padding:10px;display:none}.toast{position:fixed;bottom:23px;left:50%;transform:translate(-50%,20px);background:#393f4b;color:white;padding:11px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.app{padding:20px 16px 34px}.layout{grid-template-columns:1fr;gap:18px}.side-col{display:grid;grid-template-columns:1fr 1fr;align-items:start}.balance{padding:24px 22px;min-height:265px}.balance-actions{right:19px;bottom:19px}.action{padding:10px 12px}.today{display:none}.panel,.side-panel{padding:18px}.quick-panel{padding:17px 14px 14px}.quick-actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.quick-button{min-height:76px;padding:10px 4px}.quick-label{font-size:12px}.transactions{order:4;padding-bottom:4px}.chart-panel{order:5;min-height:193px}}
    @media(max-width:430px){.side-col{grid-template-columns:1fr}.balance-amount{font-size:37px}.stats{gap:10px}.stat{padding:15px}.stat-val{font-size:17px}.balance-actions{gap:6px}.action{font-size:12px;padding:10px}.header{margin-bottom:22px}.quick-actions{grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}.quick-button{min-height:76px}.quick-label{font-size:12px}}
    @media(prefers-color-scheme:dark){
      :root{--paper:#171a21;--white:#232731;--ink:#edf1f5;--muted:#b2bac5;--line:#353b46;--green:#ec7899;--mint:#3d2630;--red:#ff879e;--yellow:#819cab;--shadow:0 18px 55px #0003;color-scheme:dark}
      .avatar{background:#414753;color:#f4f6f8}
      .balance{background:#2c303b}
      .action.income{background:#e7edf2;color:#303640}
      .quick-button{background:#2a303a;border-color:#3b424e;color:var(--ink)}.quick-button:hover{background:#392832;border-color:#8b3d56}
      .stat-icon{background:#343945}.stat.exp .stat-icon{background:#3d2932}
      .bar{background:#e06b8c}.bar.out{background:#718a99}.chart-label{color:#aab1bc}
      .transaction{border-color:#343a44}.tx-icon,.cat-icon{background:#343a45}
      .cat-track{background:#3b414c}.cat-progress{background:#d4577d}
      .tip{background:#2b3340}.tip p{color:#c0c8d2}
      .close{background:#373e49;color:#edf1f5}.switch{background:#363d49}.switch button.active[data-type="income"]{background:#4a515e;color:#fff}
      .input{background:#1c2028;color:#edf1f5;border-color:#414854}.input:focus{border-color:#ec7899;box-shadow:0 0 0 3px #ec789928}
      .delete{color:#ff879e}.toast{background:#14171d}
    }

<body>
  <div class="app">
    <header><div class="brand"><div class="brand-mark">↗</div><span>Кошелёк</span></div><div class="top-right"><span class="today" id="today"></span><div class="avatar">Я</div></div></header>
    <div class="layout">
      <main class="main-col">
        <section class="balance"><div class="balance-label">Общий баланс</div><div class="balance-amount" id="balance">0 сум</div><div class="account-balances"><div class="account-balance"><div class="account-name"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9a2 2 0 0 0-2 2m14 4a2 2 0 0 0 2-2M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>Наличные</div><div class="account-value" id="cashBalance">0 сум</div></div><div class="account-balance"><div class="account-name"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 9h20M6 15h4"/></svg>На карте</div><div class="account-value" id="cardBalance">0 сум</div></div></div><div class="balance-foot"><span class="dot"></span><span>Ваши финансы под контролем</span></div><div class="balance-actions"><button class="action income" data-open="income">＋ Доход</button><button class="action expense" data-open="expense">− Расход</button></div></section>
        <section class="quick-panel"><div class="quick-head"><h2>Быстрый расход</h2><span>Сегодня: <strong id="todaySpend">0 сум</strong></span></div><div class="quick-actions" id="quickActions"></div></section>
        <div class="stats"><div class="stat"><div class="stat-head"><span>Доходы за месяц</span><span class="stat-icon">↗</span></div><div class="stat-val" id="incomeTotal">0 сум</div><div class="stat-note">Всего за этот месяц</div></div><div class="stat exp"><div class="stat-head"><span>Расходы за месяц</span><span class="stat-icon">↘</span></div><div class="stat-val" id="expenseTotal">0 сум</div><div class="stat-note">Всего за этот месяц</div></div></div>
        <section class="panel chart-panel"><div class="chart-title"><h2>Движение денег</h2><div class="chart-legend"><span><i class="legend-dot"></i>Доход</span><span><i class="legend-dot red"></i>Расход</span></div></div><div class="chart" id="chart"></div></section>
        <section class="panel transactions"><div class="section-head"><h2>Последние операции</h2><button class="text-btn" id="exportBtn">Скачать CSV</button></div><div class="transaction-list" id="transactions"></div></section>
      </main>
      <aside class="side-col"><section class="side-panel"><h2>Расходы по категориям</h2><div class="category-list" id="categories"></div></section></aside>
    </div>
  </div>
  <div class="modal-backdrop" id="modal"><form class="modal" id="txForm"><div class="modal-top"><h2 id="modalTitle">Новая операция</h2><button type="button" class="close" id="closeModal" aria-label="Закрыть">×</button></div><div class="switch"><button type="button" class="active" data-type="income">Доход</button><button type="button" data-type="expense">Расход</button></div><label class="field" for="amount">Сумма</label><div class="amount-wrap"><input class="input" id="amount" type="number" inputmode="decimal" min="1" step="any" placeholder="0" required><span class="currency">сум</span></div><div class="form-row"><div><label class="field" for="category">Категория</label><select class="input" id="category"></select></div><div><label class="field" for="date">Дата</label><input class="input" id="date" type="date" required></div></div><label class="field" id="accountLabel" for="account">Куда зачислить?</label><select class="input" id="account"><option value="card">На карту</option><option value="cash">Наличными</option></select><label class="field" for="note">Описание</label><input class="input" id="note" maxlength="60" placeholder="Например, зарплата или продукты"><button class="save" type="submit">Сохранить операцию</button><button class="delete" id="deleteTx" type="button">Удалить операцию</button></form></div>
  <div class="toast" id="toast"></div>
  <script>
    const KEY='koshelek-transactions-v1';
    const names={income:['Зарплата','Перевод','Подарок','Другое'],expense:['Еда','Транспорт','Общественный транспорт','Дом','Здоровье','Покупки','Развлечения','Связь','Другое']};
    const icons={'Зарплата':'briefcase','Перевод':'transfer','Подарок':'gift','Еда':'utensils','Транспорт':'car','Общественный транспорт':'bus','Дом':'home','Здоровье':'medical','Покупки':'bag','Развлечения':'ticket','Связь':'phone','Другое':'more','Кафе':'coffee','Такси':'car','Продукты':'basket','Автобус':'bus','Аптека':'medical'};
    const iconPaths={
      briefcase:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M8 8V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3M3 13h18M10 13v2h4v-2"/>',
      transfer:'<path d="M16 3l4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/>',
      gift:'<rect x="3" y="10" width="18" height="11" rx="2"/><path d="M12 10v11M2 7h20v3H2zM12 7H8.5a2.5 2.5 0 1 1 2.5-2.5V7Zm0 0h3.5a2.5 2.5 0 1 0-2.5-2.5V7Z"/>',
      utensils:'<path d="M7 3v7M4 3v4a3 3 0 0 0 6 0V3M7 10v11M17 3v18M17 3c-2 2-3 5-3 8h3"/>',
      car:'<path d="m5 11 2-5h10l2 5M3 11h18v7H3zM5 18v2m14-2v2M6 14h.01M18 14h.01"/><path d="M5 11 3 13M19 11l2 2"/>',
      home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
      medical:'<path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/>',
      bag:'<path d="M4 8h16l-1 13H5L4 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>',
      ticket:'<path d="M3 7a2 2 0 0 0 0 4v2a2 2 0 0 0 0 4v2h18v-2a2 2 0 0 1 0-4v-2a2 2 0 0 1 0-4V5H3zM13 7v2m0 3v2m0 3v1"/>',
      phone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',
      more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
      coffee:'<path d="M4 8h13v7a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8ZM17 10h2a2 2 0 1 1 0 4h-2M7 3v2m4-2v2m4-2v2"/>',
      basket:'<path d="m3 10 2 10h14l2-10H3ZM8 10l4-7 4 7M8 13v4m4-4v4m4-4v4"/>',
      bus:'<path d="M5 16V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v11M5 9h14M5 14h14M7 19v2m10-2v2M5 16l-2 2m16-2 2 2"/><circle cx="8" cy="17" r="1"/><circle cx="16" cy="17" r="1"/>',
      cash:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9a2 2 0 0 0-2 2m14 4a2 2 0 0 0 2-2M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/>',
      card:'<rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 9h20M6 15h4"/>'
    };
    function icon(name,size=20){return `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${iconPaths[name]||iconPaths.more}</svg>`}
    const quick=[{icon:'coffee',label:'Кофе',category:'Еда'},{icon:'utensils',label:'Обед',category:'Еда'},{icon:'basket',label:'Продукты',category:'Еда'},{icon:'car',label:'Такси',category:'Транспорт'},{icon:'bus',label:'Общественный транспорт',category:'Общественный транспорт',amount:2500,account:'card'},{icon:'medical',label:'Аптека',category:'Здоровье'}];
    let items=load(), type='income', editId=null;
    const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n)+' сум', dateISO=d=>{const x=new Date(d);return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)}, newId=()=>globalThis.crypto?.randomUUID?globalThis.crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`, monthNow=dateISO(new Date()).slice(0,7);
    function load(){try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(data)?data.map(x=>({...x,account:x.account||'card'})):[]}catch{return []}}
    function save(){localStorage.setItem(KEY,JSON.stringify(items))}
    function monthItems(){return items.filter(x=>x.date.slice(0,7)===monthNow)}
    function monthLabel(d){return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(d+'T12:00:00'))}
    function render(){const delta=x=>(x.type==='income'?1:-1)*Number(x.amount||0), total=items.reduce((s,x)=>s+delta(x),0), cash=items.filter(x=>x.account==='cash').reduce((s,x)=>s+delta(x),0), card=items.filter(x=>x.account!=='cash').reduce((s,x)=>s+delta(x),0), mi=monthItems(), inc=mi.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0), exp=mi.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0), today=dateISO(new Date()), spentToday=items.filter(x=>x.type==='expense'&&x.date===today).reduce((s,x)=>s+Number(x.amount||0),0);$('#balance').textContent=money(total);$('#cashBalance').textContent=money(cash);$('#cardBalance').textContent=money(card);$('#incomeTotal').textContent=money(inc);$('#expenseTotal').textContent=money(exp);$('#todaySpend').textContent=money(spentToday);
      const list=$('#transactions');const recent=[...items].sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0)).slice(0,8);list.innerHTML=recent.length?recent.map(x=>`<div class="transaction"><div class="tx-icon">${icon(icons[x.category]||'more')}</div><div class="tx-info"><div class="tx-title">${esc(x.note||x.category)}</div><div class="tx-meta">${esc(x.category)} · ${x.account==='cash'?'Наличные':'Карта'} · ${monthLabel(x.date)}</div></div><div class="tx-amount ${x.type==='income'?'plus':''}">${x.type==='income'?'+':'−'}${money(x.amount)}</div></div>`).join(''):`<div class="empty"><div class="empty-icon">${icon('cash',26)}</div><div>Пока нет операций.<br>Добавьте первый доход или расход.</div></div>`;
      renderChart();renderCats();renderQuick();}
    function renderQuick(){const el=$('#quickActions');el.innerHTML=quick.map((q,i)=>`<button type="button" class="quick-button" data-quick="${i}"><span class="quick-icon">${icon(q.icon,22)}</span><span class="quick-label">${q.label}</span></button>`).join('')}
    function renderChart(){const el=$('#chart'),days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return dateISO(d)}), vals=days.map(d=>({d,in:items.filter(x=>x.date===d&&x.type==='income').reduce((s,x)=>s+x.amount,0),out:items.filter(x=>x.date===d&&x.type==='expense').reduce((s,x)=>s+x.amount,0)})), max=Math.max(1,...vals.flatMap(x=>[x.in,x.out]));el.innerHTML=vals.map(x=>`<div class="chart-day"><div class="bar" style="height:${Math.max(3,x.in/max*70)}%"></div><div class="bar out" style="height:${Math.max(3,x.out/max*70)}%"></div><span class="chart-label">${new Intl.DateTimeFormat('ru-RU',{weekday:'short'}).format(new Date(x.d+'T12:00:00')).replace('.','')}</span></div>`).join('')}
    function renderCats(){const sums={};monthItems().filter(x=>x.type==='expense').forEach(x=>sums[x.category]=(sums[x.category]||0)+x.amount);const sorted=Object.entries(sums).sort((a,b)=>b[1]-a[1]), el=$('#categories');el.innerHTML=sorted.length?sorted.slice(0,5).map(([n,v])=>`<div class="category-row"><div class="cat-icon">${icon(icons[n]||'more',17)}</div><div><div class="cat-name">${esc(n)}</div></div><div class="cat-amount">${money(v)}</div><div class="cat-track"><div class="cat-progress" style="width:${Math.max(4,v/sorted[0][1]*100)}%"></div></div></div>`).join(''):'<div class="empty" style="padding:14px 2px 18px">Расходы появятся здесь</div>'}
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function setType(t){type=t;document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('active',b.dataset.type===t));$('#modalTitle').textContent=editId?'Изменить операцию':t==='income'?'Новый доход':'Новый расход';$('#accountLabel').textContent=t==='income'?'Куда зачислить?':'Откуда списать?';const cats=names[t];$('#category').innerHTML=cats.map(n=>`<option>${n}</option>`).join('')}
    function openModal(t='income',item=null,preset=null){editId=item?.id||null;$('#txForm').reset();setType(item?.type||t);$('#amount').value=item?.amount||'';$('#category').value=item?.category||preset?.category||names[type][0];$('#account').value=item?.account||preset?.account||'card';$('#date').value=item?.date||dateISO(new Date());$('#note').value=item?.note||preset?.label||'';$('#deleteTx').style.display=item?'block':'none';$('#modal').classList.add('open');setTimeout(()=>$('#amount').focus(),80)}
    function close(){ $('#modal').classList.remove('open');editId=null }
    document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.open)));$('#quickActions').addEventListener('click',e=>{const b=e.target.closest('[data-quick]');if(!b)return;const q=quick[Number(b.dataset.quick)];if(q.amount){items.push({id:newId(),type:'expense',amount:q.amount,account:q.account||'card',category:q.category,date:dateISO(new Date()),note:q.label,created:Date.now()});save();render();toast(`${q.label}: −${money(q.amount)} с карты`);return}openModal('expense',null,q)});document.querySelectorAll('.switch button').forEach(b=>b.addEventListener('click',()=>setType(b.dataset.type)));$('#closeModal').onclick=close;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
    $('#txForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('#amount').value);if(!Number.isFinite(amount)||amount<=0)return;const tx={id:editId||newId(),type,amount,account:$('#account').value,category:$('#category').value,date:$('#date').value,note:$('#note').value.trim(),created:Date.now()};if(editId)items=items.map(x=>x.id===editId?tx:x);else items.push(tx);save();render();close();toast(editId?'Изменения сохранены':'Операция добавлена')});
    $('#deleteTx').onclick=()=>{if(editId){items=items.filter(x=>x.id!==editId);save();render();close();toast('Операция удалена')}};
    $('#transactions').addEventListener('click',e=>{const row=e.target.closest('.transaction');if(!row)return;const index=[...$('#transactions').children].indexOf(row);const chosen=[...items].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).slice(0,8)[index];if(chosen)openModal(chosen.type,chosen)});
    $('#exportBtn').onclick=()=>{if(!items.length){toast('Пока нечего скачивать');return}const rows=[['Дата','Тип','Счёт','Категория','Описание','Сумма'],...items.map(x=>[x.date,x.type==='income'?'Доход':'Расход',x.account==='cash'?'Наличные':'Карта',x.category,x.note,x.amount])],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='finansy.csv';a.click();URL.revokeObjectURL(a.href)};
    function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
    $('#today').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());render();
    if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
  </script>
</body>
